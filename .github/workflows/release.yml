name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build macOS App Bundle
        run: |
          go build -o "LG AC.app/Contents/MacOS/lg-ac-menubar" .
          chmod +x "LG AC.app/Contents/MacOS/lg-ac-menubar"
          zip -r -y -q LG-AC-macOS-arm64.zip "LG AC.app"

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          files: LG-AC-macOS-arm64.zip
          generate_release_notes: true
